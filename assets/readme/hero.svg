      <g transform="translate(24 169)">
        <rect width="432" height="64" rx="12" fill="#162033"/>
        <rect x="16" y="23" width="14" height="18" rx="2" fill="none" stroke="#c4b5fd"/>
        <path d="M20 28h6M20 33h6M20 38h4" stroke="#c4b5fd"/>
