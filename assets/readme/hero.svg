<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Emlembow Skills</title>
  <desc id="desc">Portable Agent Skills flow from focused SKILL.md files through the skills CLI to Codex, Claude Code, and other compatible agents.</desc>

  <rect width="1200" height="420" rx="28" fill="#0b1020"/>
  <path d="M0 88H1200M0 332H1200" stroke="#1e293b"/>
  <path d="M610 0V420" stroke="#1e293b"/>

  <g transform="translate(64 56)">
    <rect width="198" height="34" rx="17" fill="#172033" stroke="#334155"/>
    <circle cx="20" cy="17" r="5" fill="#67e8f9"/>
    <text x="36" y="23" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" letter-spacing="1.2">PORTABLE SOURCE</text>

    <text x="0" y="116" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="64" font-weight="750" letter-spacing="-2">Emlembow Skills</text>
    <text x="0" y="166" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25">Focused instructions for capable coding agents.</text>
    <text x="0" y="204" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">Inspect first. Install one. Keep the behavior portable.</text>

